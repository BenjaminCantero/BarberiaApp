server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta desconocida cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy de la API hacia el backend (nombre de servicio en docker-compose)
    location /api/ {
        # Subidas de fotos de portafolio (8 MB) y certificados (10 MB)
        client_max_body_size 12m;
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos subidos (certificados y portafolio) servidos por el backend
    location /uploads/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }
}
